# Déploiement d'un FRONT SSR SEUL : un site public rendu côté serveur.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.deploy up -d --build
#
# Contrat d'hébergement : github.com/joachimdplt/VPS-INFRA → docs/conventions.md
#
# Écart assumé au gabarit `templates/ssr-seul/` : celui-ci exige PUBLIC_API_URL
# et SERVER_API_URL parce qu'il suppose un front consommant l'API de simpleseo.
# Ce site-ci ne consomme AUCUNE API — tout son contenu est statique, dans
# src/data/. Les deux variables sont donc retirées plutôt que renseignées avec
# une valeur qui ne servirait jamais.
#
# Aucun port publié, aucune base : un seul service, joint par le proxy partagé
# via son alias sur le réseau externe `web`.
name: ${STACK:?renseignez STACK dans .env.deploy}

services:
  web:
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Lues au moment de l'envoi, jamais inlinées dans le bundle : les changer
      # demande un redémarrage, pas une reconstruction. Vides, le formulaire
      # note le message dans les journaux et le dit à la personne, au lieu de
      # l'avaler en silence.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO: ${CONTACT_TO:-}
      CONTACT_FROM: ${CONTACT_FROM:-}
    networks:
      web:
        # Alias explicite et préfixé par le stack : plusieurs applications de la
        # machine déclarent un service `web`, et un alias ambigu ferait tomber le
        # trafic sur le site d'une autre (conventions § 2).
        aliases:
          - ${STACK}-web

networks:
  web:
    external: true
